apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: deploy-template
  namespace: argo
spec:
  entrypoint: deploy
  arguments:
    parameters:
      - name: app-name
      - name: target-namespace
      - name: replicas
      - name: image
  templates:
    - name: deploy
      container:
        image: bitnami/kubectl:latest
        command: [kubectl]
        args:
          - create
          - deployment
          - "{{workflow.parameters.app-name}}"
          - "--image={{workflow.parameters.image}}"
          - "--replicas={{workflow.parameters.replicas}}"
          - "-n"
          - "{{workflow.parameters.target-namespace}}"

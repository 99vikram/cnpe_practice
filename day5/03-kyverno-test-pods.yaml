# pod-root must be rejected by require-run-as-nonroot; pod-nonroot admitted
apiVersion: v1
kind: Pod
metadata:
  name: pod-root
  namespace: kyverno-secure
spec:
  containers:
  - name: web
    image: nginx:1.27
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-nonroot
  namespace: kyverno-secure
spec:
  securityContext:
    runAsNonRoot: true
  containers:
  - name: web
    image: nginxinc/nginx-unprivileged:1.27

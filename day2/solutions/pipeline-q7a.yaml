# the entry to append under spec.tasks of app-pipeline (k edit pipeline app-pipeline -n ci-pipelines)
    - name: deploy
      taskRef:
        name: deploy
      runAfter:
        - clone
        - build
      params:
        - { name: namespace, value: staging }
      workspaces:
        - { name: source, workspace: shared-workspace }

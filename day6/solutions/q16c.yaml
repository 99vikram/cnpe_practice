apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: demo-rollout
  namespace: progressive
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-app
  workloadRef:
    apiVersion: apps/v1
    kind: Deployment
    name: demo-app
  strategy:
    canary:
      steps:
        - setWeight: 25
        - pause: {}
        - setWeight: 50
        - pause: { duration: 60s }
        - setWeight: 100
# kubectl argo rollouts set image demo-rollout demo=argoproj/rollouts-demo:green -n progressive
# kubectl argo rollouts get rollout demo-rollout -n progressive --watch   ->  Paused at step 2
# kubectl argo rollouts promote demo-rollout -n progressive

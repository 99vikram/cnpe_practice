apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: workspaces.platform.example.com
spec:
  group: platform.example.com
  scope: Namespaced
  names:
    kind: Workspace
    plural: workspaces
    singular: workspace
    shortNames: [ws]
    categories: [platform]
  versions:
  - name: v1
    served: true
    storage: true
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: Tier
      type: string
      jsonPath: .spec.tier
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required: [tier, version]
            properties:
              tier:
                type: string
                enum: [development, staging, production]
              replicas:
                type: integer
                minimum: 1
                maximum: 10
                default: 1
              version:
                type: string
                pattern: '^[0-9]+\.[0-9]+$'
              region:
                type: string
              monitoring:
                type: boolean
                default: false
          status:
            type: object
            properties:
              phase:
                type: string

apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: environments.platform.example.com
spec:
  group: platform.example.com
  scope: Namespaced
  names:
    kind: Environment
    plural: environments
    singular: environment
    shortNames: [env, envs]
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              provider:
                type: string
                enum: [aws, gcp, azure]
              region:
                type: string
              size:
                type: string
                enum: [small, medium, large]
              autoScale:
                type: boolean
